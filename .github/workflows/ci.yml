name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MoonBit
        uses: ./.github/actions/moonbit
      - run: moon version --all
      - run: moon check --deny-warn
      - run: moon test --deny-warn
