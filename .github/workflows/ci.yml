name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        uses: ./.github/actions/moonbit
      - run: moon version --all
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }} --deny-warn
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        uses: ./.github/actions/moonbit
      - run: bash tools/e2e.sh
